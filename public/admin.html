<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 묘사 퀴즈 - Admin</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <div class="eyebrow">AI DESCRIPTION QUIZ</div>
        <h1>문제 관리</h1>
      </div>
      <a class="linkbtn" href="/gm" target="_blank">GM 열기</a>
    </header>

    <section class="notice">
      <strong>무료 Render 모드</strong>
      <span>영상은 <code>public/videos</code>, 포스터는 <code>public/posters</code>에 넣고 GitHub에 푸시해줘. Admin 수정은 현재 서버에 바로 반영돼.</span>
    </section>

    <section class="panel">
      <div class="panel-title-row">
        <h2 id="formTitle">새 문제 등록</h2>
        <div class="backup-actions">
          <button type="button" id="exportBtn" class="secondary">설정 백업</button>
          <label class="import-label secondary">설정 불러오기<input id="importFile" type="file" accept="application/json,.json"></label>
          <button type="button" id="resetBtn" class="danger">GitHub 기본값 복원</button>
        </div>
      </div>

      <form id="questionForm">
        <input type="hidden" id="editingId">

        <div class="grid">
          <label>
            <span>테마 제목 <small>· 원하는 위치에서 Enter로 줄바꿈</small></span>
            <textarea id="title" name="title" rows="2" required placeholder="예: 바야흐로,\n여름이었다"></textarea>
          </label>

          <label>
            <span>매장명</span>
            <input id="store" name="store">
          </label>

          <label>
            <span>장르</span>
            <input id="genre" name="genre">
          </label>

          <label>
            <span>난이도</span>
            <input id="difficulty" name="difficulty" placeholder="예: ★★★☆">
          </label>

          <label>
            <span>플레이타임</span>
            <input id="playtime" name="playtime" placeholder="예: 60분">
          </label>

          <label>
            <span>묘사 영상 <b>*</b></span>
            <select id="video" name="video" required></select>
          </label>

          <label class="wide">
            <span>정답 포스터</span>
            <select id="poster" name="poster"></select>
          </label>
        </div>

        <div class="form-actions">
          <button class="primary" type="submit" id="saveBtn">문제 등록</button>
          <button type="button" id="cancelEdit" class="secondary hidden">수정 취소</button>
        </div>

        <div id="message"></div>
      </form>
    </section>

    <section class="panel">
      <div class="list-head">
        <div>
          <h2>문제 목록</h2>
          <p>맨 첫 번째 항목은 항상 연습문제, 두 번째부터 문제 01로 표시돼.</p>
        </div>
        <strong id="count">0문제</strong>
      </div>

      <div id="questionList" class="question-list"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
